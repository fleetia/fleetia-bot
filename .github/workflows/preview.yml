name: Fleetia preview

on:
  workflow_call:
    inputs:
      bot-ref:
        description: Full commit SHA used by this reusable workflow reference
        required: true
        type: string
    secrets:
      FLEETIA_BOT_PRIVATE_KEY:
        required: true

permissions: {}

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      accepted: ${{ steps.resolve.outputs.accepted }}
      action: ${{ steps.resolve.outputs.action }}
      branch_id: ${{ steps.resolve.outputs.branch_id }}
      request: ${{ steps.resolve.outputs.request }}
      sha: ${{ steps.resolve.outputs.sha }}
    steps:
      - name: Check out trusted bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fleetia/fleetia-bot
          ref: ${{ inputs.bot-ref }}
          path: .fleetia-bot
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: .fleetia-bot/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install bot dependencies
        working-directory: .fleetia-bot
        run: pnpm install --frozen-lockfile
      - name: Resolve authorized request
        id: resolve
        working-directory: .fleetia-bot
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BOT_REF: ${{ inputs.bot-ref }}
        run: pnpm bot resolve

  prepare:
    needs: resolve
    if: needs.resolve.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    concurrency:
      group: fleetia-preview-${{ github.repository_id }}-${{ needs.resolve.outputs.branch_id }}
      cancel-in-progress: false
      queue: max
    outputs:
      deploy: ${{ steps.prepare.outputs.deploy }}
      detail: ${{ steps.prepare.outputs.detail }}
      deployed_sha: ${{ steps.prepare.outputs.deployed_sha }}
    steps:
      - name: Check out trusted bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fleetia/fleetia-bot
          ref: ${{ inputs.bot-ref }}
          path: .fleetia-bot
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: .fleetia-bot/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install bot dependencies
        working-directory: .fleetia-bot
        run: pnpm install --frozen-lockfile
      - name: Assume preview role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.FLEETIA_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.FLEETIA_AWS_REGION || 'ap-northeast-2' }}
      - name: Prepare deployment or handle status and deletion
        id: prepare
        working-directory: .fleetia-bot
        env:
          REQUEST: ${{ needs.resolve.outputs.request }}
          GITHUB_TOKEN: ${{ github.token }}
          AWS_REGION: ${{ vars.FLEETIA_AWS_REGION || 'ap-northeast-2' }}
          FLEETIA_PREVIEW_STACK: ${{ vars.FLEETIA_PREVIEW_STACK }}
          FLEETIA_AWS_ACCOUNT_ID: ${{ vars.FLEETIA_AWS_ACCOUNT_ID }}
        run: pnpm bot prepare

  build:
    needs: [resolve, prepare]
    if: needs.prepare.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: read
    steps:
      - name: Check out trusted bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fleetia/fleetia-bot
          ref: ${{ inputs.bot-ref }}
          path: .fleetia-bot
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: .fleetia-bot/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install bot dependencies
        working-directory: .fleetia-bot
        run: pnpm install --frozen-lockfile
      - name: Check out requested source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ needs.resolve.outputs.sha }}
          path: app
          persist-credentials: false
      - name: Verify source SHA
        working-directory: app
        env:
          EXPECTED_SHA: ${{ needs.resolve.outputs.sha }}
        run: test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
      - name: Configure package registry
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
          registry-url: https://npm.pkg.github.com
          scope: "@fleetia"
      - name: Install application dependencies
        working-directory: app
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: pnpm install --frozen-lockfile
      - name: Validate and build registered project
        working-directory: .fleetia-bot
        env:
          APP_DIR: ${{ github.workspace }}/app
          PREVIEW_BRANCH: ${{ needs.resolve.outputs.branch_id }}
        run: pnpm exec tsx src/build.ts
      - name: Upload preview artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: app/dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: [resolve, prepare, build]
    if: needs.prepare.outputs.deploy == 'true' && needs.build.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      pull-requests: read
      actions: read
      id-token: write
    concurrency:
      group: fleetia-preview-${{ github.repository_id }}-${{ needs.resolve.outputs.branch_id }}
      cancel-in-progress: false
      queue: max
    outputs:
      detail: ${{ steps.publish.outputs.detail }}
      deployed_sha: ${{ steps.publish.outputs.deployed_sha }}
    steps:
      - name: Check out trusted bot
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: fleetia/fleetia-bot
          ref: ${{ inputs.bot-ref }}
          path: .fleetia-bot
          persist-credentials: false
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 11.25.0
          package_json_file: .fleetia-bot/package.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24"
      - name: Install bot dependencies
        working-directory: .fleetia-bot
        run: pnpm install --frozen-lockfile
      - name: Download this run's build
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: preview-${{ github.run_id }}-${{ github.run_attempt }}
          path: preview-artifact
      - name: Assume preview role
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.FLEETIA_PREVIEW_ROLE_ARN }}
          aws-region: ${{ vars.FLEETIA_AWS_REGION || 'ap-northeast-2' }}
      - name: Revalidate request and publish
        id: publish
        working-directory: .fleetia-bot
        env:
          REQUEST: ${{ needs.resolve.outputs.request }}
          ARTIFACT_DIR: ${{ github.workspace }}/preview-artifact
          GITHUB_TOKEN: ${{ github.token }}
          AWS_REGION: ${{ vars.FLEETIA_AWS_REGION || 'ap-northeast-2' }}
          FLEETIA_PREVIEW_STACK: ${{ vars.FLEETIA_PREVIEW_STACK }}
          FLEETIA_AWS_ACCOUNT_ID: ${{ vars.FLEETIA_AWS_ACCOUNT_ID }}
        run: pnpm bot publish

  report-building:
    needs: [resolve, prepare]
    if: needs.prepare.outputs.deploy == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/comment.yml
    with:
      bot-ref: ${{ inputs.bot-ref }}
      branch-id: ${{ needs.resolve.outputs.branch_id }}
      request: ${{ needs.resolve.outputs.request }}
      status: building
      detail: Building and validating the requested commit.
      deployed-sha: ${{ needs.prepare.outputs.deployed_sha }}
    secrets:
      FLEETIA_BOT_PRIVATE_KEY: ${{ secrets.FLEETIA_BOT_PRIVATE_KEY }}

  report-publishing:
    needs: [resolve, prepare, build]
    if: needs.prepare.outputs.deploy == 'true' && needs.build.result == 'success'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/comment.yml
    with:
      bot-ref: ${{ inputs.bot-ref }}
      branch-id: ${{ needs.resolve.outputs.branch_id }}
      request: ${{ needs.resolve.outputs.request }}
      status: publishing
      detail: Build passed. Waiting to revalidate and publish the preview.
      deployed-sha: ${{ needs.prepare.outputs.deployed_sha }}
    secrets:
      FLEETIA_BOT_PRIVATE_KEY: ${{ secrets.FLEETIA_BOT_PRIVATE_KEY }}

  report:
    needs: [resolve, prepare, build, publish, report-building, report-publishing]
    if: always() && needs.resolve.outputs.accepted == 'true'
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/comment.yml
    with:
      bot-ref: ${{ inputs.bot-ref }}
      branch-id: ${{ needs.resolve.outputs.branch_id }}
      request: ${{ needs.resolve.outputs.request }}
      status: ${{ (needs.prepare.result == 'failure' || needs.build.result == 'failure' || needs.publish.result == 'failure') && 'failure' || (needs.prepare.result == 'cancelled' || needs.build.result == 'cancelled' || needs.publish.result == 'cancelled') && 'cancelled' || 'success' }}
      detail: ${{ needs.prepare.result == 'failure' && (needs.prepare.outputs.detail || 'Preview preparation failed. Check the workflow logs.') || needs.build.result == 'failure' && 'Preview build or validation failed. Check the workflow logs.' || needs.publish.result == 'failure' && (needs.publish.outputs.detail || 'Preview publishing failed. Check the workflow logs.') || (needs.prepare.result == 'cancelled' || needs.build.result == 'cancelled' || needs.publish.result == 'cancelled') && 'Preview request was cancelled.' || needs.publish.outputs.detail || needs.prepare.outputs.detail }}
      deployed-sha: ${{ needs.publish.outputs.deployed_sha || needs.prepare.outputs.deployed_sha }}
    secrets:
      FLEETIA_BOT_PRIVATE_KEY: ${{ secrets.FLEETIA_BOT_PRIVATE_KEY }}

